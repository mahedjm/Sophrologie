<!-- Page d'atterrissage générique pour le success_url de Stripe Checkout.

  <span class="brand">

      <svg viewBox="0 0 40 40" width="28" height="28"><path d="M4 22c4-10 8 10 12 0s8-10 12 0 8 10 8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-text">SoBiOse</span>
  </span>
</header>

<main class="admin-main">
  <section class="admin-card admin-login">

  </section>
