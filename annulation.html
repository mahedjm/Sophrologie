<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuler ma séance — SoBiOse</title>
<meta name="robots" content="noindex, nofollow">

<!-- Page publique mais non indexée : atteinte via le lien d'annulation envoyé
     par email après paiement d'un rendez-vous. Le remboursement (intégral
     si +24h avant la séance, 50% en deçà) est calculé côté serveur, voir
     supabase/functions/cancel-reservation. -->

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <span class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="28" height="28"><path class="m-so" d="M20 20C20 11 26 5 35 5c0 9-6 15-15 15z" transform="rotate(270 20 20)"/><path class="m-bio" d="M20 20C20 11 26 5 35 5c0 9-6 15-15 15z"/><path class="m-biose" d="M20 20C20 11 26 5 35 5c0 9-6 15-15 15z" transform="rotate(90 20 20)"/><path class="m-ose" d="M20 20C20 11 26 5 35 5c0 9-6 15-15 15z" transform="rotate(180 20 20)"/></svg>
    </span>
    <span class="brand-text">SoBiOse</span>
  </span>
</header>

<main class="admin-main">
  <section class="admin-card admin-login">
    <h1>Annuler ma séance</h1>
    <p class="admin-hint" id="cancel-message">Chargement…</p>

    <div id="cancel-details" hidden>
      <p class="admin-hint">Montant remboursé : <strong id="cancel-refund-amount"></strong></p>
      <p class="admin-hint">Politique : remboursement intégral si annulation plus de 24h avant
      la séance, 50% conservé en deçà.</p>
      <button type="button" class="btn btn-primary" id="cancel-confirm-btn">Confirmer l'annulation</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/annulation.js"></script>
</body>
</html>
